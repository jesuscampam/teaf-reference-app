[project]
name = "teaf-reference-app"
version = "0.4.0-alpha"
description = "Official reference application for the Torus Enterprise Application Framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.7.0",
]

# NOTE: `teaf` is intentionally NOT declared as a PEP 508 dependency
# here. As of TEAF v0.6.1-alpha it IS a real, installable package (see
# docs/BOOTSTRAP.md), but it isn't published to any package index, so
# pinning an unqualified "teaf" entry would break `pip install -e .`
# anywhere the sibling checkout isn't at a fixed, known path. Per this
# project's documented setup (docs/RUNNING.md), install it explicitly
# first: `pip install -e ../torus-enterprise-framework`.

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
    "fastapi>=0.115.6",
    "ruff>=0.8.4",
    "black>=24.10.0",
    "mypy>=1.14.1",
    # Browser end-to-end tests (tests/e2e/). The browser binary itself is
    # not installed by pip — see docs/RUNNING.md. Tests skip cleanly when
    # it is absent, so a machine without one still runs the full suite.
    "playwright>=1.49.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
packages = ["app", "tests"]
strict = true
# `teaf` is installed as a setuptools PEP 660 editable install, which
# uses a dynamic import finder mypy's static resolver can't traverse.
# Point mypy directly at the sibling checkout's sources instead (same
# location `pip install -e ../torus-enterprise-framework` installs
# from) so `from teaf import ...` type-checks for real.
mypy_path = "../torus-enterprise-framework"

# mypy_path above makes all of teaf/_internal/ visible for static
# resolution (see comment above), including provider modules this app
# never imports or uses (Redis cache, LDAP identity). Those third-party
# clients aren't installed here — installing them just to silence mypy
# would add real dependencies for code this app never calls. Scoped
# strictly to those two external libraries; nothing in app/ or tests/ is
# affected (verified: zero mypy findings under app/ or tests/ paths).
[[tool.mypy.overrides]]
module = ["redis.*", "ldap3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "e2e: browser end-to-end test — needs Chromium and starts a real uvicorn server",
]
